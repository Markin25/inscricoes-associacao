# Perfil dev: PostgreSQL do docker-compose.
# URL e usuário têm padrão local (não são segredo); a senha vem de DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/parolin}
spring.datasource.username=${DB_USER:parolin}

spring.thymeleaf.cache=false
logging.level.br.org.parolin=DEBUG
