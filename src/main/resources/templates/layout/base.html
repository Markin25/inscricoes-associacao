<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos comuns. Uso: th:replace="~{layout/base :: head('Título')}" -->
<head th:fragment="head(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Inscrições Parolin'">Inscrições Parolin</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<a th:fragment="pular" class="pular" href="#conteudo">Pular para o conteúdo</a>

<!-- logado: mostra o botão Sair (POST com token CSRF, inserido pelo th:action) -->
<header th:fragment="appbar(logado)" class="appbar">
    <a class="brand" th:href="@{/}">Inscrições<small>Associação de moradores do Parolin</small></a>
    <form th:if="${logado}" method="post" th:action="@{/logout}" class="m-0">
        <button type="submit" class="btn btn-appbar">Sair</button>
    </form>
</header>

<!-- Aviso com ícone + texto + cor. "a" é um dto.Alerta. Recebe o foco ao abrir a tela. -->
<div th:fragment="alerta(a)" th:class="'aviso ' + ${a.tipo()}"
     th:attr="role=${a.tipo() == 'info'} ? 'status' : 'alert'" tabindex="-1" data-foco>
    <span class="ico" aria-hidden="true" th:text="${a.icone()}">i</span>
    <div>
        <span class="visually-hidden" th:text="${a.rotulo()} + ': '">Aviso: </span>
        <strong th:text="${a.titulo()}">Título</strong>
        <div th:if="${a.detalhe() != null}" th:text="${a.detalhe()}">Detalhe</div>
    </div>
</div>

<!-- Erro junto ao campo: ícone + texto. O id é usado no aria-describedby do campo. -->
<div th:fragment="erroCampo(id, mensagem)" class="erro-campo" th:id="${id}">
    <span aria-hidden="true">✖</span><span th:text="${mensagem}">Mensagem</span>
</div>

<!-- Botão para voltar ao menu -->
<p th:fragment="voltarMenu" class="voltar">
    <a class="btn btn-outline-primary btn-pequeno" th:href="@{/}">Voltar ao menu</a>
</p>

</body>
</html>
