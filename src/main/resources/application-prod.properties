# Perfil prod: tudo por variável de ambiente, sem valor padrão.
# DB_URL, DB_USER e DB_PASSWORD são obrigatórias (herdadas de application.properties).
# Hospedagem: Render (aplicação, Docker) + Neon (PostgreSQL). Passo a passo em docs/deploy.md.

# A Render informa a porta na variável PORT.
server.port=${PORT:8080}

server.servlet.session.cookie.secure=true
# A Render entrega a aplicação atrás de um proxy HTTPS (cabeçalhos X-Forwarded-*).
server.forward-headers-strategy=framework

# Poucas conexões e nenhuma ociosa aberta: o PostgreSQL gratuito do Neon entra em repouso
# quando ninguém usa o sistema, o que economiza a cota mensal de computação.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000

spring.thymeleaf.cache=true
logging.level.root=INFO
