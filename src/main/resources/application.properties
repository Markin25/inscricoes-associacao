# Configuração comum a todos os perfis.
spring.application.name=inscricoes-associacao
spring.profiles.default=dev

# Banco: segredos só por variável de ambiente (DB_URL, DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# schema.sql é a fonte da verdade; o Hibernate só confere se as entidades batem.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Usuário inicial (criado só se a tabela usuarios estiver vazia).
app.admin.usuario=${APP_ADMIN_USER:}
app.admin.senha=${APP_ADMIN_PASSWORD:}

# Erros sem detalhe técnico na tela.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie

# Desempenho (RNF03): HTML, CSS e JS comprimidos; CSS/JS com cache longo e nome versionado
# pelo conteúdo (app.css vira app-<hash>.css), então uma mudança nunca fica presa no cache.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
