# Configuração comum a todos os perfis.
spring.application.name=inscricoes-associacao
spring.profiles.default=dev

# Banco: segredos só por variável de ambiente (DB_URL, DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# schema.sql é a fonte da verdade; o Hibernate só confere se as entidades batem.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Usuário inicial (criado só se a tabela usuarios estiver vazia).
app.admin.usuario=${APP_ADMIN_USER:}
app.admin.senha=${APP_ADMIN_PASSWORD:}

# Erros sem detalhe técnico na tela.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie

spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
